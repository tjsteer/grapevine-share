name: Build organisation logos
on:
  push:
    paths: ["logos/domains.txt", "tools/build_logos.py"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python tools/build_logos.py
      - name: Commit logos
        run: |
          git config user.name "grapevine-logos"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos.json
          git diff --cached --quiet || (git commit -m "Update organisation logos" && git push)
